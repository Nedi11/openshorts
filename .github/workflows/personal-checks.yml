name: Personal feature checks
on:
  push:
    branches: [personal]
  pull_request:
    branches: [personal]
permissions:
  contents: read
jobs:
  feature-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest fastapi httpx
      - run: python3 scripts/check-custom-features.py
      - run: python3 -m pytest tests/custom/ -q
